
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RoboPay — Telegram Stars Terminal</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    :root {
      --bg: #07090e;
      --card: rgba(18, 24, 38, 0.85);
      --border: rgba(56, 189, 248, 0.25);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.45);
      --success: #10b981;
      --star: #fbbf24;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at 50% 30%, #111c33 0%, var(--bg) 72%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(56, 189, 248, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.04) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 0;
    }

    .stage {
      position: relative;
      width: 100%;
      max-width: 360px;
      height: 440px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    /* --- РОБОТ --- */
    .robot-wrapper {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }

    .robot-head {
      width: 224px;
      height: 168px;
      background: linear-gradient(160deg, #1e293b 0%, #0f172a 100%);
      border: 2px solid var(--border);
      border-radius: 46px;
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.65),
        inset 0 2px 12px rgba(255, 255, 255, 0.08),
        0 0 32px var(--accent-glow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: box-shadow 0.4s ease, border-color 0.4s ease;
    }

    .robot-head.success-state {
      border-color: rgba(16, 185, 129, 0.65);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65), 0 0 42px rgba(16, 185, 129, 0.5);
    }

    .antenna {
      position: absolute;
      top: -22px;
      width: 6px;
      height: 20px;
      background: #334155;
      border-radius: 4px;
    }
    .antenna-bulb {
      position: absolute;
      top: -9px;
      left: -4px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 14px var(--accent);
    }

    .visor {
      width: 186px;
      height: 128px;
      background: #04070d;
      border-radius: 32px;
      border: 1px solid rgba(56, 189, 248, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      position: relative;
      overflow: hidden;
    }

    .eyes-row {
      display: flex;
      gap: 34px;
      align-items: center;
    }

    .eye-socket {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.07);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .pupil {
      width: 24px;
      height: 28px;
      background: var(--accent);
      border-radius: 12px;
      box-shadow: 0 0 18px var(--accent);
      position: relative;
    }

    .pupil::after {
      content: "";
      position: absolute;
      top: 4px;
      left: 5px;
      width: 7px;
      height: 7px;
      background: #fff;
      border-radius: 50%;
      opacity: 0.9;
    }

    .eyelid {
      position: absolute;
      top: -100%;
      left: 0;
      width: 100%;
      height: 100%;
      background: #04070d;
      z-index: 2;
    }

    .mouth {
      width: 34px;
      height: 6px;
      background: var(--accent);
      border-radius: 6px;
      box-shadow: 0 0 10px var(--accent);
      opacity: 0.9;
    }

    .status-pill {
      margin-top: 24px;
      padding: 8px 18px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(148, 163, 184, 0.18);
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.3px;
      text-align: center;
      transition: color 0.3s ease;
    }

    /* --- КАРТОЧКА ЧЕКА --- */
    .receipt-card {
      position: absolute;
      width: 100%;
      background: var(--card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75);
      opacity: 0;
      pointer-events: none;
      transform: scale(0.75) translateY(25px);
    }

    .receipt-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px dashed rgba(148, 163, 184, 0.22);
    }

    .merchant-badge {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
      padding: 5px 10px;
      border-radius: 8px;
    }

    .order-id-tag {
      font-size: 11px;
      color: var(--muted);
      font-family: monospace;
    }

    .item-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #fff;
    }

    .item-desc {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.4;
      margin-bottom: 22px;
    }

    .amount-box {
      background: rgba(7, 9, 14, 0.65);
      border: 1px solid rgba(251, 191, 36, 0.25);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }

    .amount-label {
      font-size: 13px;
      color: var(--muted);
    }

    .amount-value {
      font-size: 26px;
      font-weight: 800;
      color: var(--star);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pay-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);
      transition: transform 0.15s ease;
    }

    .pay-btn:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>

  <div class="stage">
    <!-- РОБОТ -->
    <div class="robot-wrapper" id="robotWrapper">
      <div class="robot-head" id="robotHead">
        <div class="antenna"><div class="antenna-bulb" id="antennaBulb"></div></div>
        <div class="visor" id="visor">
          <div class="eyes-row">
            <div class="eye-socket">
              <div class="eyelid" id="lidLeft"></div>
              <div class="pupil" id="pupilLeft"></div>
            </div>
            <div class="eye-socket">
              <div class="eyelid" id="lidRight"></div>
              <div class="pupil" id="pupilRight"></div>
            </div>
          </div>
          <div class="mouth" id="mouth"></div>
        </div>
      </div>
      <div class="status-pill" id="statusPill">RoboPay активен • Коснись меня</div>
    </div>

    <!-- КАРТОЧКА ОПЛАТЫ (появляется только при входе по платёжной ссылке) -->
    <div class="receipt-card" id="receiptCard">
      <div class="receipt-header">
        <span class="merchant-badge" id="merchantName">PARTNER BOT</span>
        <span class="order-id-tag" id="orderTag">#ORD</span>
      </div>
      <div class="item-title" id="itemTitle">Услуга</div>
      <div class="item-desc" id="itemDesc">Мгновенная оплата через Telegram Stars</div>
      <div class="amount-box">
        <span class="amount-label">К оплате</span>
        <span class="amount-value"><span id="amountStars">0</span> ⭐</span>
      </div>
      <button class="pay-btn" id="payBtn">Оплатить в Stars</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor("#07090e");
      tg.setBackgroundColor("#07090e");
    }

    const robotWrapper = document.getElementById("robotWrapper");
    const robotHead = document.getElementById("robotHead");
    const antennaBulb = document.getElementById("antennaBulb");
    const pupilLeft = document.getElementById("pupilLeft");
    const pupilRight = document.getElementById("pupilRight");
    const lidLeft = document.getElementById("lidLeft");
    const lidRight = document.getElementById("lidRight");
    const mouth = document.getElementById("mouth");
    const statusPill = document.getElementById("statusPill");
    const receiptCard = document.getElementById("receiptCard");
    const payBtn = document.getElementById("payBtn");

    let isCheckoutMode = false;
    let isReacting = false;
    let lastReactionIndex = -1;
    let currentOrder = null;

    // 1. Плавное левитирование головы в покое
    gsap.to(robotHead, {
      y: -8,
      duration: 2.2,
      repeat: -1,
      yoyo: true,
      ease: "sine.inOut"
    });

    // 2. Слежение глаз за пальцем / курсором
    const moveLeftX = gsap.quickTo(pupilLeft, "x", { duration: 0.25, ease: "power3.out" });
    const moveLeftY = gsap.quickTo(pupilLeft, "y", { duration: 0.25, ease: "power3.out" });
    const moveRightX = gsap.quickTo(pupilRight, "x", { duration: 0.25, ease: "power3.out" });
    const moveRightY = gsap.quickTo(pupilRight, "y", { duration: 0.25, ease: "power3.out" });

    function trackPointer(clientX, clientY) {
      if (isCheckoutMode || isReacting) return;
      const rect = robotHead.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      const deltaX = Math.max(-1, Math.min(1, (clientX - centerX) / (window.innerWidth * 0.45)));
      const deltaY = Math.max(-1, Math.min(1, (clientY - centerY) / (window.innerHeight * 0.45)));

      const maxOffset = 9;
      moveLeftX(deltaX * maxOffset);
      moveLeftY(deltaY * maxOffset);
      moveRightX(deltaX * maxOffset);
      moveRightY(deltaY * maxOffset);
    }

    window.addEventListener("pointermove", (e) => trackPointer(e.clientX, e.clientY));
    window.addEventListener("touchmove", (e) => {
      if (e.touches[0]) trackPointer(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    // 3. Естественное моргание
    function scheduleBlink() {
      const delay = 2200 + Math.random() * 3000;
      setTimeout(() => {
        if (!isCheckoutMode && !isReacting) {
          gsap.timeline()
            .to([lidLeft, lidRight], { top: "0%", duration: 0.08, ease: "power2.in" })
            .to([lidLeft, lidRight], { top: "-100%", duration: 0.12, ease: "power2.out" });
        }
        scheduleBlink();
      }, delay);
    }
    scheduleBlink();

    // 4. НАБОР РАЗНЫХ АНИМАЦИЙ ПРИ КЛИКЕ ПО РОБОТУ
    const tapReactions = [
      // Эмоция 1: Радостная улыбка и счастливый прищур
      () => {
        statusPill.textContent = "Привет! Готов принимать Stars ✨";
        return gsap.timeline()
          .to(robotHead, { scale: 1.06, rotation: -3, duration: 0.18, ease: "back.out(2)" })
          .to([pupilLeft, pupilRight], { scaleY: 0.4, scaleX: 1.15, borderRadius: "20px 20px 4px 4px", duration: 0.18 }, 0)
          .to(mouth, { width: 46, height: 14, borderRadius: "4px 4px 20px 20px", duration: 0.18 }, 0)
          .to(robotHead, { rotation: 3, duration: 0.18 })
          .to(robotHead, { scale: 1, rotation: 0, duration: 0.35, ease: "elastic.out(1, 0.5)" }, "+=0.25")
          .to([pupilLeft, pupilRight], { scaleY: 1, scaleX: 1, borderRadius: "12px", duration: 0.25 }, "<")
          .to(mouth, { width: 34, height: 6, borderRadius: "6px", duration: 0.25 }, "<");
      },
      // Эмоция 2: Игривое подмигивание и наклон головы
      () => {
        statusPill.textContent = "Быстрая оплата в один клик 😉";
        return gsap.timeline()
          .to(robotHead, { rotation: 7, scale: 0.97, duration: 0.2, ease: "power2.out" })
          .to(lidRight, { top: "0%", duration: 0.1 }, 0)
          .to(pupilLeft, { scale: 1.2, duration: 0.15 }, 0)
          .to(mouth, { width: 24, x: -4, duration: 0.15 }, 0)
          .to(lidRight, { top: "-100%", duration: 0.15 }, "+=0.35")
          .to(robotHead, { rotation: 0, scale: 1, duration: 0.4, ease: "elastic.out(1, 0.5)" }, "<")
          .to(pupilLeft, { scale: 1, duration: 0.2 }, "<")
          .to(mouth, { width: 34, x: 0, duration: 0.2 }, "<");
      },
      // Эмоция 3: Удивление (широкие глаза + рот «О»)
      () => {
        statusPill.textContent = "Ого! Щекотно же ⚡";
        return gsap.timeline()
          .to(robotHead, { scale: 1.08, y: -16, duration: 0.16, ease: "power2.out" })
          .to([pupilLeft, pupilRight], { x: 0, y: 0, scale: 1.35, duration: 0.16 }, 0)
          .to(mouth, { width: 16, height: 16, borderRadius: "50%", duration: 0.16 }, 0)
          .to(robotHead, { scale: 1, y: -8, duration: 0.45, ease: "bounce.out" }, "+=0.3")
          .to([pupilLeft, pupilRight], { scale: 1, duration: 0.25 }, "<")
          .to(mouth, { width: 34, height: 6, borderRadius: "6px", duration: 0.25 }, "<");
      },
      // Эмоция 4: Режим «Золотая звезда» (вспышка антенны и глаз)
      () => {
        statusPill.textContent = "Режим Telegram Stars активирован ⭐";
        return gsap.timeline()
          .to(robotHead, { scale: 0.95, duration: 0.1 })
          .to([pupilLeft, pupilRight, mouth, antennaBulb], {
            backgroundColor: "#fbbf24",
            boxShadow: "0 0 24px #fbbf24",
            scale: 1.15,
            duration: 0.2
          })
          .to(robotHead, { scale: 1.04, duration: 0.25, ease: "back.out(2)" }, "<")
          .to([pupilLeft, pupilRight, mouth, antennaBulb], {
            backgroundColor: "#38bdf8",
            boxShadow: "0 0 18px #38bdf8",
            scale: 1,
            duration: 0.35
          }, "+=0.45")
          .to(robotHead, { scale: 1, duration: 0.3 }, "<");
      },
      // Эмоция 5: Любопытное сканирование по сторонам
      () => {
        statusPill.textContent = "Сканирую входящие сигналы... 📡";
        return gsap.timeline()
          .to([pupilLeft, pupilRight], { x: -11, y: -2, duration: 0.15 })
          .to(robotHead, { rotation: -4, duration: 0.15 }, "<")
          .to([pupilLeft, pupilRight], { x: 11, y: -2, duration: 0.22 }, "+=0.1")
          .to(robotHead, { rotation: 4, duration: 0.22 }, "<")
          .to([pupilLeft, pupilRight], { x: 0, y: 0, duration: 0.18 }, "+=0.1")
          .to(robotHead, { rotation: 0, duration: 0.25 }, "<");
      }
    ];

    robotHead.addEventListener("click", () => {
      if (isCheckoutMode || isReacting) return;
      isReacting = true;
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred("light");

      // Выбираем случайную реакцию, отличную от предыдущей
      let nextIndex;
      do {
        nextIndex = Math.floor(Math.random() * tapReactions.length);
      } while (nextIndex === lastReactionIndex && tapReactions.length > 1);
      lastReactionIndex = nextIndex;

      const tl = tapReactions[nextIndex]();
      tl.eventCallback("onComplete", () => {
        isReacting = false;
      });
    });

    // 5. МОРФИНГ ЛИЦА В ЧЕК (только при входе по ссылке с order_id)
    function morphToReceipt(orderData) {
      isCheckoutMode = true;
      currentOrder = orderData;

      document.getElementById("merchantName").textContent = orderData.merchant_title;
      document.getElementById("orderTag").textContent = `#${orderData.order_id.toUpperCase()}`;
      document.getElementById("itemTitle").textContent = orderData.title;
      document.getElementById("itemDesc").textContent = orderData.description;
      document.getElementById("amountStars").textContent = orderData.amount_stars;

      const tl = gsap.timeline();
      tl.to([pupilLeft, pupilRight], {
        x: 0,
        y: 0,
        scale: 1.25,
        duration: 0.25,
        ease: "back.out(2)"
      })
      .to(robotWrapper, {
        scale: 0.65,
        y: -70,
        opacity: 0,
        filter: "blur(10px)",
        duration: 0.38,
        ease: "power3.in",
        onComplete: () => {
          robotWrapper.style.pointerEvents = "none";
          receiptCard.style.pointerEvents = "auto";
        }
      }, "+=0.12")
      .to(receiptCard, {
        opacity: 1,
        scale: 1,
        y: 0,
        duration: 0.5,
        ease: "back.out(1.4)"
      }, "-=0.15");
    }

    // 6. АНИМАЦИЯ УСПЕШНОЙ ОПЛАТЫ
    function morphToSuccess() {
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");

      const tl = gsap.timeline();
      tl.to(receiptCard, {
        opacity: 0,
        scale: 0.8,
        y: 30,
        duration: 0.3,
        ease: "power2.in",
        onComplete: () => {
          receiptCard.style.pointerEvents = "none";
          robotWrapper.style.pointerEvents = "auto";
          robotHead.classList.add("success-state");
          pupilLeft.style.background = "#10b981";
          pupilLeft.style.boxShadow = "0 0 20px #10b981";
          pupilRight.style.background = "#10b981";
          pupilRight.style.boxShadow = "0 0 20px #10b981";
          mouth.style.background = "#10b981";
          mouth.style.width = "48px";
          statusPill.textContent = "✅ Оплата подтверждена! Сигнал отправлен.";
          statusPill.style.color = "#6ee7b7";
        }
      })
      .to(robotWrapper, {
        opacity: 1,
        scale: 1.05,
        y: 0,
        filter: "blur(0px)",
        duration: 0.45,
        ease: "elastic.out(1, 0.5)"
      })
      .to(lidRight, { top: "0%", duration: 0.1 })
      .to(lidRight, { top: "-100%", duration: 0.15 }, "+=0.25")
      .to(robotWrapper, { scale: 1, duration: 0.2 });

      if (tg && currentOrder?.invoice_link) {
        setTimeout(() => tg.close(), 2200);
      }
    }

    payBtn.addEventListener("click", () => {
      if (currentOrder?.invoice_link && tg?.openInvoice) {
        tg.openInvoice(currentOrder.invoice_link, (status) => {
          if (status === "paid") {
            morphToSuccess();
          } else if (status === "failed") {
            statusPill.textContent = "❌ Ошибка платежа";
          }
        });
      }
    });

    // Проверка наличия заказа в URL (?startapp=ord_... или ?order_id=ord_...)
    async function initCheckoutFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const orderId = tg?.initDataUnsafe?.start_param || params.get("order_id");
      if (!orderId) return; // Если ссылки нет — оставляем интерактивного робота

      statusPill.textContent = "Загрузка счёта...";
      try {
        const res = await fetch(`/api/v1/orders/${encodeURIComponent(orderId)}`);
        if (!res.ok) throw new Error("Order not found");
        const order = await res.json();

        if (order.status === "paid") {
          statusPill.textContent = "Этот счёт уже оплачен ✅";
          return;
        }
        setTimeout(() => morphToReceipt(order), 400);
      } catch (err) {
        statusPill.textContent = "⚠️ Счёт не найден или устарел";
      }
    }

    initCheckoutFromUrl();
  </script>
</body>
</html>
