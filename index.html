<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RoboPay</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.6.0-rc.1/lib/qr-code-styling.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f5f7fa;
      --surface-2: #eaedf2;
      --border: rgba(15, 23, 42, 0.08);
      --ink: #0b1220;
      --muted: #64748b;
      --subtle: #94a3b8;
      --eye: #00e5ff;
      --eye-deep: #00acc1;
      --green: #10b981;
      --red: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg); color: var(--ink); min-height: 100vh; overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .tabular { font-variant-numeric: tabular-nums; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--subtle); }

    /* Кастомные inline SVG-стикеры */
    .stk { display: inline-block; vertical-align: -0.18em; flex-shrink: 0; }
    .stk-sm { width: 15px; height: 15px; }
    .stk-md { width: 20px; height: 20px; }
    .stk-lg { width: 28px; height: 28px; }

    /* Пиксельный 2D канвас глаз (чистый 2D, никаких теней и шторок) */
    canvas.px-canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* --- ЗАСТАВКА --- */
    .splash {
      position: fixed; inset: 0; background: #ffffff; z-index: 200;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    }
    .splash-title {
      font-size: 30px; font-weight: 800; letter-spacing: -0.04em; color: var(--ink);
      opacity: 0; transform: translateY(10px);
    }

    /* --- REAL-TIME УВЕДОМЛЕНИЕ СВЕРХУ С ПИКСЕЛЬНЫМИ ГЛАЗАМИ --- */
    .rt-banner {
      position: fixed; top: 12px; left: 50%; transform: translate(-50%, -130px);
      background: rgba(255, 255, 255, 0.86); backdrop-filter: blur(24px) saturate(190%);
      -webkit-backdrop-filter: blur(24px) saturate(190%);
      border: 1px solid rgba(15, 23, 42, 0.08); border-radius: 999px;
      padding: 8px 18px 8px 12px; display: flex; align-items: center; gap: 10px;
      box-shadow: 0 14px 36px rgba(15, 23, 42, 0.13); z-index: 150; max-width: 92vw;
    }
    .rt-text { font-size: 13.5px; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* --- ЭКРАНЫ --- */
    .screen { display: none; min-height: 100vh; width: 100%; position: relative; }
    .screen.active { display: flex; flex-direction: column; }

    /* --- ЭКРАН 1: ГЛАВНАЯ (2D ПИКСЕЛЬНЫЕ ГЛАЗА НА ВЕСЬ ЭКРАН) --- */
    .home-screen {
      align-items: center; justify-content: center; padding: 20px 16px 140px; user-select: none;
    }
    .home-eyes-wrap {
      width: 100%; max-width: 380px; cursor: pointer; display: flex; flex-direction: column; align-items: center;
    }
    .home-emotion-hint {
      margin-top: 22px; font-size: 13.5px; font-weight: 600; color: var(--subtle);
      min-height: 20px; text-align: center;
    }

    .home-controls {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
      padding: 12px 16px calc(18px + env(safe-area-inset-bottom));
      display: flex; align-items: center; justify-content: center; gap: 10px; pointer-events: none;
    }
    .glass-pill-btn {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.66);
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 14px 36px rgba(15, 23, 42, 0.10), inset 0 1px 0 rgba(255, 255, 255, 0.95);
      border-radius: 24px; cursor: pointer; color: var(--ink);
      display: flex; align-items: center; gap: 11px; padding: 12px 18px;
      transition: transform 0.14s ease, background 0.15s ease;
    }
    .glass-pill-btn:active { transform: scale(0.95); }
    .qr-scan-main { flex: 1; max-width: 248px; justify-content: center; }
    .qr-icon-badge {
      width: 38px; height: 38px; border-radius: 13px; background: var(--ink); color: #fff;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .btn-txt-title { font-size: 14px; font-weight: 700; line-height: 1.15; text-align: left; }
    .btn-txt-sub { font-size: 11px; color: var(--muted); margin-top: 2px; text-align: left; }

    /* --- ЭКРАН 2: ТЕНЕВОЙ АНИМАЦИОННЫЙ 3D-КРУГ ОПЛАТЫ --- */
    .pay-screen {
      align-items: center; justify-content: space-between; padding: 20px 20px 28px; overflow: hidden;
      perspective: 900px;
    }
    .pay-top-eyes {
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1); z-index: 6;
    }
    .pay-top-eyes.fullscreen-energy {
      transform: translateY(25vh) scale(1.95);
    }
    .energy-layer {
      position: fixed; inset: 0; pointer-events: none; z-index: 4; overflow: hidden; display: none;
    }
    .energy-ring {
      position: absolute; top: 44%; left: 50%; width: 64px; height: 64px;
      border-radius: 50%; border: 3px solid var(--eye); transform: translate(-50%, -50%); opacity: 0;
    }
    .energy-token {
      position: absolute; top: 44%; left: 50%; font-weight: 800; font-size: 22px;
      color: var(--eye-deep); user-select: none;
    }

    .orb-stage {
      position: relative; width: 300px; height: 300px; display: flex; align-items: center; justify-content: center;
      margin: auto 0; z-index: 3; transform-style: preserve-3d;
    }
    /* Пульсирующая мягкая тень под 3D-кругом */
    .orb-floor-shadow {
      position: absolute; bottom: -26px; width: 210px; height: 34px; border-radius: 50%;
      background: radial-gradient(ellipse, rgba(11, 18, 32, 0.22) 0%, rgba(11, 18, 32, 0.06) 52%, transparent 75%);
      filter: blur(8px); animation: shadowPulse 3.4s ease-in-out infinite;
    }
    @keyframes shadowPulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(0.86); opacity: 0.55; }
    }

    /* Двойная переливающаяся подсветка */
    .orb-glow, .orb-glow-2 {
      position: absolute; inset: -16px; border-radius: 50%;
      background: conic-gradient(from 0deg, #00e5ff, #6366f1, #ec4899, #f59e0b, #10b981, #00e5ff);
      filter: blur(26px); opacity: 0.72; animation: spinGlow 4.2s linear infinite;
      transition: background 0.45s ease, opacity 0.4s ease;
    }
    .orb-glow-2 {
      inset: -6px; filter: blur(12px); opacity: 0.42; animation: spinGlow 6.5s linear infinite reverse;
    }
    .orb-glow.state-success, .orb-glow-2.state-success {
      background: conic-gradient(from 0deg, #10b981, #34d399, #059669, #6ee7b7, #10b981);
      opacity: 0.92;
    }
    .orb-glow.state-error, .orb-glow-2.state-error {
      background: conic-gradient(from 0deg, #ef4444, #f87171, #dc2626, #fca5a5, #ef4444);
      opacity: 0.92;
    }
    @keyframes spinGlow { to { transform: rotate(360deg); } }

    /* Глубокий скульптурный выдавленный белый 3D-круг */
    .orb-circle {
      position: relative; width: 278px; height: 278px; border-radius: 50%;
      background: radial-gradient(circle at 30% 24%, #ffffff 0%, #f5f7fb 58%, #e9eef6 100%);
      box-shadow:
        0 28px 54px -10px rgba(11, 18, 32, 0.22),
        0 10px 22px -6px rgba(11, 18, 32, 0.14),
        -16px -16px 34px rgba(255, 255, 255, 0.98),
        inset 6px 6px 16px rgba(255, 255, 255, 0.95),
        inset -10px -12px 24px rgba(15, 23, 42, 0.11);
      border: 2px solid rgba(255, 255, 255, 0.95);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 26px; text-align: center;
      animation: orbFloat 3.4s ease-in-out infinite;
    }
    @keyframes orbFloat {
      0%, 100% { transform: translateY(0px) rotateX(2deg); }
      50% { transform: translateY(-9px) rotateX(-2deg); }
    }
    .orb-badge {
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--muted); background: rgba(15, 23, 42, 0.06); padding: 4px 11px; border-radius: 999px; margin-bottom: 8px;
    }
    .orb-title { font-size: 16px; font-weight: 700; line-height: 1.2; max-width: 212px; margin-bottom: 8px; }
    .orb-amount { font-size: 40px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
    .orb-unit { font-size: 16px; font-weight: 700; color: var(--eye-deep); margin-left: 3px; }
    .orb-input {
      width: 120px; text-align: center; font-size: 32px; font-weight: 800; border: none;
      border-bottom: 2px solid rgba(15, 23, 42, 0.15); background: transparent; outline: none; color: var(--ink); padding: 2px 0;
    }
    .orb-sub { font-size: 12px; color: var(--muted); margin-top: 8px; }
    .orb-result-icon { display: none; flex-direction: column; align-items: center; gap: 10px; }
    .pay-footer { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 8px; z-index: 6; }

    /* --- ЭКРАН 3: МЕНЮ --- */
    .menu-screen { padding-bottom: 104px; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between; padding: 11px 16px;
      border-bottom: 1px solid var(--border); background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(22px) saturate(180%); -webkit-backdrop-filter: blur(22px) saturate(180%);
      position: sticky; top: 0; z-index: 25;
    }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 16px; letter-spacing: -0.025em; }
    .top-actions { display: flex; align-items: center; gap: 7px; }
    .round-btn {
      width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border);
      background: rgba(255,255,255,0.88); color: var(--ink); display: inline-flex;
      align-items: center; justify-content: center; cursor: pointer;
    }
    .color-dot { width: 15px; height: 15px; border-radius: 50%; background: var(--eye); }
    .bal-chip {
      height: 34px; padding: 0 12px; border-radius: 999px; background: var(--surface);
      border: 1px solid var(--border); font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 5px;
    }

    .subview { display: none; padding: 16px; max-width: 440px; width: 100%; margin: 0 auto; }
    .subview.active { display: block; }
    .card {
      background: #fff; border: 1px solid var(--border); border-radius: 22px; padding: 18px;
      margin-bottom: 14px; box-shadow: 0 4px 18px rgba(15, 23, 42, 0.035);
    }
    .card-soft { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; }
    .hero-bal { font-size: 40px; font-weight: 800; letter-spacing: -0.04em; margin: 4px 0 16px; }
    .row-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .sec-title { font-size: 11.5px; font-weight: 700; color: var(--subtle); text-transform: uppercase; letter-spacing: 0.06em; margin: 16px 0 8px 4px; }
    .tx-list { display: flex; flex-direction: column; gap: 8px; }
    .tx-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; background: #fff; border: 1px solid var(--border); border-radius: 14px; }
    .badge { padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .b-pending { color: #b45309; background: #fef3c7; }
    .b-approved { color: #047857; background: #d1fae5; }
    .b-rejected { color: #b91c1c; background: #fee2e2; }

    /* Прозрачная нижняя панель Apple Glass */
    .apple-dock-wrap {
      position: fixed; bottom: 0; left: 0; right: 0; padding: 0 16px calc(14px + env(safe-area-inset-bottom));
      display: flex; justify-content: center; pointer-events: none; z-index: 35;
    }
    .apple-dock {
      pointer-events: auto; width: 100%; max-width: 396px;
      background: rgba(255, 255, 255, 0.56);
      backdrop-filter: blur(28px) saturate(210%);
      -webkit-backdrop-filter: blur(28px) saturate(210%);
      border: 1px solid rgba(255, 255, 255, 0.78);
      box-shadow: 0 14px 38px rgba(15, 23, 42, 0.11), inset 0 1px 0 rgba(255, 255, 255, 0.85);
      border-radius: 26px; display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px;
    }
    .dock-btn {
      background: transparent; border: none; border-radius: 20px; padding: 7px 4px;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      font-size: 10.5px; font-weight: 600; color: var(--muted); cursor: pointer; transition: all 0.18s;
    }
    .dock-btn.active { background: rgba(15, 23, 42, 0.08); color: var(--ink); }
    .dock-btn svg { width: 20px; height: 20px; stroke-width: 2; }

    /* --- ЭКРАН 4: ТЕХПОДДЕРЖКА (ПИКСЕЛЬНОЕ ЛИЦО + РОТ + GROQ) --- */
    .support-screen { height: 100vh; overflow: hidden; background: #ffffff; }
    .sup-top {
      display: flex; align-items: center; justify-content: space-between; padding: 12px 16px;
      border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.86); backdrop-filter: blur(18px); z-index: 10;
    }
    .sup-face-stage {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 16px; cursor: pointer; transition: all 0.42s cubic-bezier(0.22, 1, 0.36, 1); user-select: none;
    }
    .sup-face-stage.compact { flex: 0 0 auto; padding: 8px 16px 6px; border-bottom: 1px solid var(--border); }
    .sup-face-stage.compact canvas { transform: scale(0.5); margin: -42px 0 -36px; }
    .sup-face-stage canvas { transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1), margin 0.42s; }
    .sup-status { margin-top: 12px; font-size: 14px; font-weight: 600; color: var(--muted); text-align: center; }
    .sup-face-stage.compact .sup-status { margin-top: 4px; font-size: 12px; }

    .sup-voice-bar { padding: 14px 20px calc(22px + env(safe-area-inset-bottom)); display: flex; justify-content: center; }
    .sup-chat-wrap { display: none; flex: 1; flex-direction: column; overflow: hidden; }
    .sup-chat-wrap.open { display: flex; }
    .sup-messages { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
    .msg-bubble { max-width: 82%; padding: 11px 14px; border-radius: 18px; font-size: 14px; line-height: 1.45; }
    .msg-user { align-self: flex-end; background: var(--ink); color: #fff; border-bottom-right-radius: 5px; }
    .msg-bot { align-self: flex-start; background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-bottom-left-radius: 5px; }
    .sup-input-bar {
      padding: 10px 14px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border);
      background: rgba(255,255,255,0.88); backdrop-filter: blur(20px); display: flex; gap: 8px;
    }

    /* Кнопки, поля, модалки */
    .btn {
      width: 100%; padding: 13px 16px; border-radius: 14px; border: 1px solid transparent;
      font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      transition: transform 0.1s ease, background 0.15s;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--ink); color: #fff; }
    .btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--border); }
    .btn-ghost { background: transparent; color: var(--muted); padding: 9px; }
    .btn-sm { padding: 10px 8px; font-size: 13px; }

    .field { margin-bottom: 11px; }
    .field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
    .input, .select {
      width: 100%; padding: 11px 13px; border-radius: 12px; border: 1px solid var(--border);
      background: #fff; color: var(--ink); font-size: 15px; outline: none;
    }
    .input:focus { border-color: var(--ink); }

    .chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin-bottom: 11px; }
    .chip {
      padding: 9px 4px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface);
      font-size: 13px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    }
    .chip.active { background: var(--ink); color: #fff; border-color: var(--ink); }

    .tier-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 11px; }
    .tier-card { padding: 10px; border-radius: 13px; border: 1.5px solid var(--border); background: #fff; cursor: pointer; text-align: left; }
    .tier-card.active { border-color: var(--ink); background: var(--surface); }

    .owner-box { background: #fff9eb; border: 1px solid #fde68a; border-radius: 14px; padding: 12px; margin-bottom: 12px; }
    .owner-link {
      display: flex; align-items: center; justify-content: space-between; padding: 9px 12px;
      background: #fff; border: 1px solid #fcd34d; border-radius: 10px; text-decoration: none; color: var(--ink); margin-top: 8px;
    }

    .qr-wrap { display: flex; flex-direction: column; align-items: center; padding: 16px; background: #fff; border: 1px solid var(--border); border-radius: 16px; margin: 12px 0; }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(11, 18, 32, 0.42); backdrop-filter: blur(5px);
      display: none; align-items: center; justify-content: center; padding: 16px; z-index: 80;
    }
    .modal-backdrop.open { display: flex; }
    .modal-box {
      background: #fff; width: 100%; max-width: 390px; border-radius: 26px; padding: 20px;
      box-shadow: 0 24px 60px rgba(11, 18, 32, 0.22); max-height: 90vh; overflow-y: auto;
    }
    .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .modal-close {
      width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border);
      background: var(--surface); font-size: 20px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    }
  </style>
</head>
<body>
  <!-- SVG-спрайт собственных стикеров (Звезда RoboPay и Подарок) вместо базовых эмодзи -->
  <svg style="display:none;" aria-hidden="true">
    <defs>
      <linearGradient id="rpStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFE066"/><stop offset="55%" stop-color="#F59E0B"/><stop offset="100%" stop-color="#D97706"/>
      </linearGradient>
      <linearGradient id="rpGiftBox" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#38BDF8"/><stop offset="100%" stop-color="#0284C7"/>
      </linearGradient>
      <symbol id="stk-star" viewBox="0 0 24 24">
        <path fill="url(#rpStarGrad)" d="M12 1.8l2.
